name: Build and Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  tests:
    name: Tests
    uses: ./.github/workflows/tests.yml

  lint:
    name: Lint and Format
    uses: ./.github/workflows/lint-and-format.yml

  docker:
    name: Build and push production image
    needs: [tests, lint]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKER_USERNAME }}/acquisitions
          flavor: |
            latest=false
          tags: |
            type=ref,event=branch
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=prod-{{date 'YYYYMMDD-HHmmss'}}

      - name: Build and push image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: production
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Add summary
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          IMAGE_NAME="$(echo "$TAGS" | head -n 1 | cut -d: -f1)" #shubhamsingh7913/acquisitions

          {
            echo "## Docker image published"
            echo ""
            echo "**Image:** \`$IMAGE_NAME\`"
            echo ""
            echo "**Platforms:** linux/amd64"
            echo ""
            echo "**Digest:** \`$DIGEST\`"
            echo ""
            echo "**Tags:**"
            echo ""
            echo "$TAGS" | while read -r tag; do
              echo "- \`$tag\`"
            done
            echo ""
            echo "Pull it with: \`docker pull $(echo "$TAGS" | grep ':latest$' | head -n 1)\`"
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Deploy to EC2
    needs: docker
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ap-south-1
      IMAGE_REPO: shubhamsingh7913/acquisitions
      APP_URL: https://acquisitions.duckdns.org
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Find the app server
        id: server
        run: |
          read -r INSTANCE_ID PUBLIC_DNS < <(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=acquisitions-app" "Name=instance-state-name,Values=running" \
            --query "Reservations[0].Instances[0].[InstanceId,PublicDnsName]" \
            --output text)

          if [ -z "$INSTANCE_ID" ] || [ "$INSTANCE_ID" = "None" ]; then
            echo "::error title=No server running::No running instance tagged acquisitions-app. Run terraform apply in infra/app first."
            exit 1
          fi

          echo "instance_id=$INSTANCE_ID" >> "$GITHUB_OUTPUT"
          echo "public_dns=$PUBLIC_DNS" >> "$GITHUB_OUTPUT"

      - name: Record the running image
        id: current
        env:
          INSTANCE_ID: ${{ steps.server.outputs.instance_id }}
        run: |
          # Single quotes on purpose: $(...) must run on the server, not here
          # shellcheck disable=SC2016
          CMD='docker image inspect --format "{{index .RepoDigests 0}}" "$(docker inspect --format "{{.Image}}" acquisitions 2>/dev/null)" 2>/dev/null || true'
          IMAGE=$(bash scripts/run-on-server.sh "$INSTANCE_ID" "Record running image" "$CMD")
          echo "Running now: ${IMAGE:-none}"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js 22.x
        uses: actions/setup-node@v5
        with:
          node-version: 22.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run database migrations
        run: |
          DATABASE_URL=$(aws ssm get-parameter \
            --name /acquisitions/prod/DATABASE_URL \
            --with-decryption \
            --query Parameter.Value \
            --output text)
          echo "::add-mask::$DATABASE_URL"
          export DATABASE_URL

          npm run db:migrate

      - name: Deploy the new image
        id: deploy
        env:
          INSTANCE_ID: ${{ steps.server.outputs.instance_id }}
        run: |
          IMAGE="$IMAGE_REPO:sha-${GITHUB_SHA::7}"
          echo "Deploying $IMAGE to $INSTANCE_ID"
          bash scripts/run-on-server.sh "$INSTANCE_ID" "Deploy sha-${GITHUB_SHA::7}" "/usr/local/bin/deploy-app $IMAGE"

      - name: Check the app is healthy
        id: health
        run: |
          curl --fail --silent --show-error \
            --retry 10 --retry-delay 3 --retry-all-errors \
            "$APP_URL/health-rollback-test"
          echo ""
          echo "Deployed sha-${GITHUB_SHA::7} to $APP_URL" >> "$GITHUB_STEP_SUMMARY"

      # Runs only if the deploy or the health check failed and an image was
      # running before. The job still ends as failed, so the bad deploy is
      # visible, but the site is back on the last working version.
      - name: Roll back to the previous image
        if: failure() && steps.current.outputs.image != '' && (steps.deploy.outcome == 'failure' || steps.health.outcome == 'failure')
        env:
          INSTANCE_ID: ${{ steps.server.outputs.instance_id }}
          PREVIOUS_IMAGE: ${{ steps.current.outputs.image }}
        run: |
          echo "::warning title=Rolling back::Deploy of sha-${GITHUB_SHA::7} failed. Restoring $PREVIOUS_IMAGE"
          bash scripts/run-on-server.sh "$INSTANCE_ID" "Roll back sha-${GITHUB_SHA::7}" "/usr/local/bin/deploy-app $PREVIOUS_IMAGE"

          curl --fail --silent --show-error \
            --retry 10 --retry-delay 3 --retry-all-errors \
            "$APP_URL/health"
          echo ""
          echo "Deploy of sha-${GITHUB_SHA::7} failed. Rolled back to $PREVIOUS_IMAGE" >> "$GITHUB_STEP_SUMMARY"
